
portfolio_name: HeiPlanet Vector & Disease Modeling Suite
schema_version: "1.0"

models:
  - model_name: WNV-R0
    version: "1.0"
    domain: West Nile Virus (WNV) Transmission Potential
    model_type: Process-based epidemiological model
    primary_task: Thermal suitability Estimation
    inputs:
      - temperature
    outputs:
      - r0_estimate
    intended_use:
      - Temperature-driven seasonal WNV risk assessment
      - Regional comparison of thermal suitability
      - Climate scenario analysis
      - Public health preparedness planning
    limitations:
      - Temperature-driven effects only
      - Relative R₀, not interpretable as a threshold parameter
      - Cannot predict number of cases

  - model_name: Aedes albopictus Population Model
    version: "1.0"
    domain: Aedes albopictus Population Dynamics
    model_type: Process-based entomological model (stage-structured, climate-driven)
    primary_task: Vector Abundance / Climatic Suitability Estimation
    inputs:
      - temperature
      - precipitation
      - human_population_density
    outputs:
      - adults
      - imm
      - juv
      - eggs
      - ed
    intended_use:
      - Climate-driven suitability and relative abundance mapping
      - Mechanistic covariate for establishment and early-warning models
      - Climate scenario analysis
    limitations:
      - Estimates abundance, not presence; no introduction or spread
      - No dispersal between grid cells
      - Not validated against field abundance data

governance:
  organization: HeiPlanet
  update_policy: Updates as new data become available
  review_required: true
