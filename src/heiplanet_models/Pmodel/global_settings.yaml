# ========================================================================
# ======                      INGESTION SETTINGS                    ======
# ========================================================================
ingestion:
    path_root_datasets: "/home/iulusoy/projects/onehealth-platform/heiplanet-data/heiplanet_data/.data_heiplanet_db/silver/"
    
    xarray_load_settings:
        chunks: auto
    
    filename_components:
        temperature_dataset: 
            #prefix: "milan_temperature_"
            prefix: "era5_data_daily_2014-01-01-2018-12-31_midnight_2t_tp_daily_unicoords_adjlon_celsius_mm_silver"
            suffix: 
            extension: ".nc"
        rainfall_dataset: 
            #prefix: "milan_rainfall_"
            prefix: "era5_data_daily_2014-01-01-2018-12-31_midnight_2t_tp_daily_unicoords_adjlon_celsius_mm_silver"
            suffix: 
            extension: ".nc"
        human_population_dataset: 
            #prefix: "milan_population_"
            prefix: "population_histsoc_30arcmin_annual_1901_2021_unicoords_2014-2018_popdens_01deg_silver"
            #suffix: 
            suffix: 
            extension: ".nc"

    initial_conditions:
        # NetCDF model output whose last time step is the initial state.
        file_path_initial_conditions:
        # Start each year from the last day of the previous year's output
        # (serving path), if that file exists; takes precedence over the path above.
        chain_previous_year: True
        # If no initial state file is available (e.g. the first year), run the
        # year this many times first and start from the resulting final state.
        spinup_years: 1


# ========================================================================
# ======                   TRANSFORMATION SETTINGS                  ======
# ========================================================================
transformation:
    # # ---- Temperature Data
    temperature_dataset:
        data_variable : "t2m"
        preprocessing:
            dimension_order: 
                - "longitude"
                - "latitude"
                - "time"
        
    # # ---- Rainfall Data
    rainfall_dataset:
        data_variable : "tp"
        preprocessing:
            dimension_order: 
                - "longitude"
                - "latitude"
                - "time"
    
    # # ---- Human population Data
    human_population_dataset:
        data_variable : "total-population-density"
        preprocessing:
            dimension_order: 
                - "longitude"
                - "latitude"
                - "time"
        postprocessing:
            align_dataset: True


# =================================================================
# ======                   SERVING SETTINGS                  ======
# =================================================================
serving: 
    path_output_datasets: ".data_heiplanet_db/reference"
    # scipy_chunked streams output to disk; storage type and zlib compression
    # of the compartment variables ("f4" = float32, "f8" = float64).
    dtype: "f4"
    compression: True
    filename_components:
        prefix: "Mosquito_abundance_Global_"
        suffix: 
        extension: ".nc"

# =================================================================
# ======                  ODE SYSTEM SETTINGS                ======
# =================================================================
ode_system:
    # Production default for adaptive solvers. Use --time-step 10 in the
    # benchmark/profiler when validating RK4 against Octave step_t=10.
    time_step: 10
    model_variables:
        - "eggs"
        - "ed"
        - "juv"
        - "imm"
        - "adults"

# =================================================================
# ======                   EXECUTION SETTINGS                 ======
# =================================================================
execution:
    initial_year: 2018
    final_year: 2018
    
