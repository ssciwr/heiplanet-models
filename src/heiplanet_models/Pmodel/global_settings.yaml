# ========================================================================
# ======                      INGESTION SETTINGS                    ======
# ========================================================================
ingestion:
    path_root_datasets: "data/in/Pratik_datalake"
    
    xarray_load_settings:
        chunks: auto
    
    filename_components:
        temperature_dataset: 
            #prefix: "milan_temperature_"
            prefix: "ERA5land_global_t2m_daily_0.5_"
            suffix: 
            extension: ".nc"
        rainfall_dataset: 
            #prefix: "milan_rainfall_"
            prefix: "ERA5land_global_tp_daily_0.5_"
            suffix: 
            extension: ".nc"
        human_population_dataset: 
            #prefix: "milan_population_"
            prefix: "pop_dens_"
            #suffix: 
            suffix: "_global_0.5_aligned"
            extension: ".nc"

    initial_conditions:
        file_path_initial_conditions:


# ========================================================================
# ======                   TRANSFORMATION SETTINGS                  ======
# ========================================================================
transformation:
    # # ---- Temperature Data
    temperature_dataset:
        data_variable : "t2m"
        preprocessing:
            names_dimensions: 
                "valid_time": "time"
            dimension_order: 
                - "longitude"
                - "latitude"
                - "time"
        
    # # ---- Rainfall Data
    rainfall_dataset:
        data_variable : "tp"
        preprocessing:
            dimension_order: 
                - "longitude"
                - "latitude"
                - "time"
    
    # # ---- Human population Data
    human_population_dataset:
        data_variable : "dens"
        preprocessing:
            names_dimensions: 
                "lon": "longitude"
                "lat": "latitude"
            dimension_order: 
                - "longitude"
                - "latitude"
                - "time"
        postprocessing:
            align_dataset: True


# =================================================================
# ======                   SERVING SETTINGS                  ======
# =================================================================
serving: 
    path_output_datasets: "data/out/Pratik_datalake"
    filename_components:
        prefix: "Mosquito_abundance_Global_"
        suffix: 
        extension: ".nc"

# =================================================================
# ======                  ODE SYSTEM SETTINGS                ======
# =================================================================
ode_system:
    # Production default for adaptive solvers. Use --time-step 10 in the
    # benchmark/profiler when validating RK4 against Octave step_t=10.
    time_step: 10
    model_variables:
        - "eggs"
        - "ed"
        - "juv"
        - "imm"
        - "adults"

# =================================================================
# ======                   EXECUTION SETTINGS                 ======
# =================================================================
execution:
    initial_year: 2024
    final_year: 2024
    
